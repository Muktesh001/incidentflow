services:
  mongodb:
    image: mongo:7
    container_name: incidentflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: incidentflow
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  n8n:
    image: n8nio/n8n:latest
    container_name: incidentflow-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: n8n-admin-change-in-production
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      N8N_LOG_LEVEL: info
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      mongodb:
        condition: service_healthy

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: incidentflow-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: incidentflow
      JWT_SECRET: replace-with-32-char-min-secret-from-env-file
      JWT_EXPIRES_IN: 7d
      AUTH_REQUIRED: "false"
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-1.5-flash-latest
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/incidentflow
      N8N_API_KEY: ""
      INCIDENTFLOW_API_BASE: http://api:5000
      CORS_ORIGIN: "*"
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_SEC: 60
      RATE_LIMIT_MAX: 600
      RATE_LIMIT_AUTH_WINDOW_SEC: 900
      RATE_LIMIT_AUTH_MAX: 15
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: incidentflow-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
  n8n_data:
